# GitHub Pages Deployment Workflow
# ทุกครั้งที่ push ไปยัง main branch จะ build และ deploy อัตโนมัติ

name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]

  # อนุญาตให้รัน workflow นี้ด้วยมือจากแท็บ Actions
  workflow_dispatch:

# ตั้งสิทธิ์ให้ GITHUB_TOKEN เพื่อ deploy ไปยัง GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# อนุญาตให้ deploy ทีละ 1 ครั้ง ไม่ให้ซ้อนกัน
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build with Next.js
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
